name: Refresh public data snapshots

on:
  schedule:
    - cron: "17 9 3 * *" # 09:17 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download and filter EPA RMP + USDA FSIS data
        run: node scripts/refresh-data.mjs
      - name: Commit updated snapshots
        run: |
          if git diff --quiet -- lib/rmp-west.json lib/fsis-west.json; then
            echo "Snapshots unchanged."
            exit 0
          fi
          git config user.name "keep-supply-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rmp-west.json lib/fsis-west.json
          git commit -m "Refresh public data snapshots (EPA RMP / USDA FSIS)"
          git push
